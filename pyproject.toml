[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcw-radar-simulator"
version = "0.1.0"
description = "X-band FMCW radar simulator with range-Doppler processing and a PySide6 GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "PySide6>=6.5", "pyqtgraph>=0.13.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fmcw-sim = "fmcw_sim.__main__:main"

[tool.setuptools]
packages = ["fmcw_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
